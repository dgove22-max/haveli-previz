<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haveli Previz — venue model</title>
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem('hp-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/ui.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #view { position: fixed; inset: 50px 0 0 0; }
  canvas { display: block; }
  #boot-error { position: fixed; top: 66px; left: 20px; color: var(--warn); max-width: 420px; }

  /* ── right panel ── */
  #sheet {
    position: fixed; top: 62px; right: 12px; bottom: 12px; width: 296px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 16px 30px;
  }
  #sheet h2 {
    margin: 0 0 8px; font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.11em; text-transform: uppercase; color: var(--soft);
  }
  .group { padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--line-2); }
  .group:last-child { border-bottom: 0; margin-bottom: 0; }

  label.row {
    display: flex; align-items: center; gap: 9px;
    padding: 3px 0; cursor: pointer; user-select: none;
  }
  label.row:hover { color: var(--accent); }
  label.row span { flex: 1; }

  button.view, button.tab {
    display: block; width: 100%; text-align: left;
    padding: 6px 10px; margin-bottom: 4px;
    font: inherit; color: var(--ink);
    background: var(--card-2); border: 1px solid var(--line); border-radius: 7px;
    cursor: pointer;
  }
  button.view:hover, button.tab:hover { border-color: var(--accent); color: var(--accent); }
  /* active must outrank :hover, or hovering an active button paints accent-on-accent */
  button.view[data-active="true"], button.tab[data-active="true"],
  button[data-active="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button[data-active="true"] .soft { color: var(--on-accent); opacity: 0.72; }
  button.accent { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-bg); }
  #roletabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
  #roletabs .tab { text-align: center; padding: 6px 2px; margin: 0; }

  table.dims { width: 100%; border-collapse: collapse; }
  table.dims td { padding: 2.5px 0; vertical-align: baseline; }
  table.dims td.n {
    text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 11.5px; white-space: nowrap;
  }
  table.dims td.k { color: var(--soft); padding-right: 10px; }
  .meas  { color: var(--meas); font-weight: 500; }
  html[data-theme="dark"] .meas { font-weight: 400; }
  .stat  { color: var(--ink); }
  .estv  { color: var(--amber); }
  .warnb { font-size: 10px; }
  .legend { color: var(--soft); font-size: 11px; margin: 8px 0 0; }
  ul.unconf { margin: 0; padding-left: 16px; color: var(--soft); font-size: 11px; }
  ul.unconf li { margin-bottom: 5px; }
  ul.unconf .mono { font-size: 10px; color: var(--amber); }

  #readout {
    position: fixed; left: 20px; bottom: 16px;
    font-family: var(--mono); font-size: 11px; color: var(--soft);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #hint { position: fixed; left: 20px; bottom: 38px; font-size: 11px; color: var(--soft); pointer-events: none; }

  /* ── transport ── */
  #transport {
    position: fixed; left: calc((100vw - 320px) / 2); transform: translateX(-50%);
    bottom: 16px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 9px 14px; max-width: calc(100vw - 352px);
  }
  #transport button {
    font: inherit; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer; padding: 3px 9px; color: var(--ink);
  }
  #transport button:hover { border-color: var(--accent); color: var(--accent); }
  #transport input[type="range"] { width: 200px; accent-color: var(--accent); }
  #transport select, #transport input[type="number"] {
    font: inherit; font-size: 12px; background: var(--card-2);
    border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 2px 5px;
  }
  #transport input[type="number"] { width: 46px; }
  #tp-time { font-family: var(--mono); font-size: 11px; color: var(--soft); white-space: nowrap; }
  #tp-scale { font-family: var(--mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
  #tp-warn { font-size: 11px; color: var(--warn); }
  .tp-l { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--soft); white-space: nowrap; }
  #transport input[type="checkbox"] { accent-color: var(--accent); margin: 0; }

  /* ── editor ── */
  #editor {
    position: fixed; left: 20px; top: 66px; width: 340px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 14px 16px; max-height: calc(100vh - 200px); overflow-y: auto;
  }
  #editor h2 { margin: 0 0 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--soft); }
  #editor textarea {
    width: 100%; height: 300px; font-family: var(--mono);
    font-size: 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card-2); color: var(--ink);
  }
  #editor .qf { display: grid; grid-template-columns: auto 70px; gap: 4px 8px; align-items: center; margin: 8px 0; font-size: 11px; color: var(--soft); }
  #editor .qf input { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 2px 5px; background: var(--card-2); color: var(--ink); }
  #editor .ebtns { display: flex; gap: 6px; margin-top: 8px; }
  #editor .ebtns button { flex: 1; font: inherit; padding: 5px; cursor: pointer; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); border-radius: 6px; }
  #editor .ebtns button:hover { border-color: var(--accent); color: var(--accent); }
  #editor .err { color: var(--warn); font-size: 11px; min-height: 14px; }

  @media (max-width: 900px) {
    #sheet { width: 250px; }
    #transport { max-width: calc(100vw - 300px); flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="boot-error"></div>
<div id="sheet"></div>
<div id="hint">Drag to orbit · right-drag or shift-drag to pan · scroll to zoom · space to play/pause · , . frame step</div>
<div id="readout"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
