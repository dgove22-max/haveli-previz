<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haveli Previz — venue model</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --paper:      #dee0db;
    --paper-warm: #e9e8e2;
    --ink:        #16232e;
    --ink-soft:   #5a6670;
    --rule:       #c2c5bf;
    --blue:       #2c4a63;
    --amber:      #a06a10;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  #view { position: fixed; inset: 0; }
  canvas { display: block; }

  #masthead { position: fixed; top: 22px; left: 26px; pointer-events: none; }
  #masthead h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  #masthead p  { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
  #boot-error  { position: fixed; top: 80px; left: 26px; color: #8a2f22; max-width: 420px; }

  #sheet {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
    background: var(--paper-warm);
    border-left: 1px solid var(--rule);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 22px 20px 60px;
  }
  #sheet h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .group { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--rule); }
  .group:last-child { border-bottom: 0; margin-bottom: 0; }

  label.row {
    display: flex; align-items: center; gap: 9px;
    padding: 3px 0; cursor: pointer; user-select: none;
  }
  label.row:hover { color: var(--blue); }
  label.row input { accent-color: var(--blue); margin: 0; cursor: pointer; }
  label.row span { flex: 1; }

  button.view, button.tab {
    display: block; width: 100%; text-align: left;
    padding: 6px 9px; margin-bottom: 4px;
    font: inherit; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 2px;
    cursor: pointer;
  }
  button.view:hover, button.tab:hover { border-color: var(--blue); color: var(--blue); }
  button[data-active="true"] { background: var(--blue); border-color: var(--blue); color: var(--paper-warm); }
  button[data-active="true"] .soft { color: var(--paper-warm); opacity: 0.7; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button.accent { border-color: var(--blue); color: var(--blue); font-weight: 600; }
  #roletabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
  #roletabs .tab { text-align: center; padding: 6px 2px; margin: 0; }
  .soft { color: var(--ink-soft); font-size: 11px; }

  table.dims { width: 100%; border-collapse: collapse; }
  table.dims td { padding: 2px 0; vertical-align: baseline; }
  table.dims td.n {
    text-align: right; font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 12px; white-space: nowrap;
  }
  table.dims td.k { color: var(--ink-soft); padding-right: 10px; }
  .meas  { color: var(--blue); }
  .stat  { color: var(--ink); }
  .estv  { color: var(--amber); }
  .warnb { font-size: 10px; }
  .legend { color: var(--ink-soft); font-size: 11px; margin: 8px 0 0; }
  ul.unconf { margin: 0; padding-left: 16px; color: var(--ink-soft); font-size: 11px; }
  ul.unconf li { margin-bottom: 5px; }
  ul.unconf .mono { font-size: 10px; color: var(--amber); }

  #readout {
    position: fixed; left: 26px; bottom: 20px;
    font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--ink-soft); pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hint { position: fixed; left: 26px; bottom: 42px; font-size: 11px; color: var(--ink-soft); pointer-events: none; }

  #transport {
    position: fixed; left: calc((100vw - 300px) / 2); transform: translateX(-50%);
    bottom: 20px; display: flex; align-items: center; gap: 10px;
    background: var(--paper-warm); border: 1px solid var(--rule); border-radius: 3px;
    padding: 8px 12px; max-width: calc(100vw - 332px);
  }
  #transport button {
    font: inherit; background: transparent; border: 1px solid var(--rule);
    border-radius: 2px; cursor: pointer; padding: 3px 8px; color: var(--ink);
  }
  #transport button:hover { border-color: var(--blue); color: var(--blue); }
  #transport input[type="range"] { width: 200px; accent-color: var(--blue); }
  #transport select, #transport input[type="number"] {
    font: inherit; font-size: 12px; background: transparent;
    border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); padding: 2px 4px;
  }
  #transport input[type="number"] { width: 44px; }
  #tp-time { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  #tp-scale { font-size: 11px; color: var(--blue); white-space: nowrap; }
  #tp-warn { font-size: 11px; color: #8a2f22; }
  .tp-l { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }

  #editor {
    position: fixed; left: 26px; top: 90px; width: 340px;
    background: var(--paper-warm); border: 1px solid var(--rule); border-radius: 3px;
    padding: 14px 16px; max-height: calc(100vh - 220px); overflow-y: auto;
  }
  #editor h2 { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); }
  #editor textarea {
    width: 100%; height: 300px; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; border: 1px solid var(--rule); background: #fdfdfb; color: var(--ink);
  }
  #editor .qf { display: grid; grid-template-columns: auto 70px; gap: 4px 8px; align-items: center; margin: 8px 0; font-size: 11px; color: var(--ink-soft); }
  #editor .qf input { font: inherit; border: 1px solid var(--rule); border-radius: 2px; padding: 2px 4px; }
  #editor .ebtns { display: flex; gap: 6px; margin-top: 8px; }
  #editor .ebtns button { flex: 1; font: inherit; padding: 5px; cursor: pointer; border: 1px solid var(--rule); background: transparent; border-radius: 2px; }
  #editor .ebtns button:hover { border-color: var(--blue); color: var(--blue); }
  #editor .err { color: #8a2f22; font-size: 11px; min-height: 14px; }

  @media (max-width: 900px) {
    #sheet { width: 250px; }
    #masthead h1 { font-size: 16px; }
    #transport { max-width: calc(100vw - 300px); flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="view"></div>

<div id="masthead">
  <h1>Haveli Previz</h1>
  <p>Blue values are site measurements. Amber ⚠ values are estimates awaiting a tape.</p>
</div>
<div id="boot-error"></div>

<div id="sheet"></div>

<div id="hint">Drag to orbit · right-drag or shift-drag to pan · scroll to zoom · space to play/pause · , . frame step</div>
<div id="readout"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
